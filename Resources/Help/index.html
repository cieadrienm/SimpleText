<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aide SimpleText</title>
<style>
:root { --bg: #111317; --panel: #16191E; --text: #E6E8EC; --dim: #8A919E; --accent: #FFB454; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "SF Pro Text", system-ui, sans-serif; padding: 40px 56px; }
h1 { font-size: 34px; letter-spacing: -.6px; margin: 0 0 6px; }
p { color: var(--dim); }
</style>
</head>
<body>
<h1>Aide SimpleText</h1>
<p>Le guide est en cours d’écriture.</p>
</body>
</html>
